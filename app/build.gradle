plugins { id 'com.android.application' }

android { namespace 'jp.codex.earthquakeoverlay'; compileSdk 35
    defaultConfig { applicationId 'jp.codex.earthquakeoverlay'; minSdk 26; targetSdk 35; versionCode 2; versionName '1.0.2' }
    signingConfigs { release { storeFile file(System.getenv('ANDROID_KEYSTORE_FILE') ?: 'release-keystore.jks'); storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD'); keyAlias System.getenv('ANDROID_KEY_ALIAS'); keyPassword System.getenv('ANDROID_KEY_PASSWORD') } }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}
